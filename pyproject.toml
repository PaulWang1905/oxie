[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oxie"
version = "0.1.0"
description = "A small static site/blog generator: Markdown + Jinja2 + Tailwind"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Puyu Wang" }]
license = { text = "Apache-2.0" }
keywords = ["static-site-generator", "blog", "markdown", "jinja2"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
    "Jinja2>=3.1",
    "Markdown>=3.6",
    "pymdown-extensions>=10.0",
    "python-frontmatter>=1.1",
    "Pygments>=2.17",
    "pillow>=10.0",
    "pandas>=2.0",
]

[project.urls]
Homepage = "https://github.com/PaulWang1905/oxie"
Issues = "https://github.com/PaulWang1905/oxie/issues"

[tool.setuptools]
packages = ["oxie"]
